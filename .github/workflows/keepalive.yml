name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://provizia.onrender.com' }}
        run: |
          for attempt in 1 2 3; do
            if curl -sSf --max-time 90 "$SITE_URL/api/meta" > /dev/null; then
              echo "сайт отвечает: $SITE_URL"
              exit 0
            fi
            echo "попытка $attempt не прошла, инстанс просыпается"
            sleep 30
          done
          echo "сайт не ответил за три попытки"
          exit 1
