services:
  - type: web
    name: provizia
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/meta
    autoDeploy: true
    envVars:
      - key: DB_PATH
        value: /app/data/provizia.db
      - key: PYTHONUNBUFFERED
        value: "1"
